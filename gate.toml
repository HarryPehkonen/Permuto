# Permuto's gate. The policy is this file; the engine is kit-ci, installed once per machine:
#
#     cmake -S ~/hermes-workspace/KitCI -B build && cmake --build build
#     cmake --install build --prefix ~/.local        # -> ~/.local/bin/kit-ci
#
# One definition, three callers — by hand (scripts/gate.sh), git on commit and on push
# (.githooks/, which names the tier), and the clean-checkout proof (the `pristine` stage below,
# which runs the same scripts against git archive HEAD). Changing the gate means editing this
# file: `kit-ci --list` and `kit-ci --graph` read the same parse a run does.
#
# Until 2026-10-06 the gate WAS one file: a 1087-line tools/ci.sh that ran thirteen stages and
# printed its own summary (card t_6989cec2). Every stage it ran is declared here, in the order
# it ran them, and the work of a stage that needs more than one command lives in a script next
# to this file. What could not be expressed in this vocabulary, and how each case was resolved,
# is in INCIDENTS.md and in the notes below.

[gate]
repo = "permuto"

# pre-commit: seconds, not minutes. This is the old gate's CI_FAST_STAGES, unchanged —
# "format build tests", in that order.
[tier.fast]
stages = ["format", "build", "tests"]

# pre-push: every stage. The old hook passed `--require-clean full`; kit-ci has no per-run
# flags, so the hook sets CI_REQUIRE_CLEAN=1 in the environment instead and scripts/tree.sh
# reads it — same rule, same caller. A hand run gets these same stages and, exactly as before,
# is NOT required to have a clean tree (INCIDENTS.md).
[tier.full]
stages = ["*"]

# No stage-selection option exists in the engine: kit-ci runs TIERS, so the old habit of naming
# stages on the command line (`tools/ci.sh fuzz`) is gone — run the stage's script directly
# (scripts/<stage>.sh, the same run the stage makes). And there is deliberately no knob in this
# file that skips a check: weakening a stage to make it pass is the one thing it must never gain.

# ---------------------------------------------------------------- the stages
# Declaration order IS the run order for tier.full, and it is the order the old
# CI_DEFAULT_STAGES used: tree docs format build tests version asan tsan fuzz tidy pristine
# package. (`kitprobes` sat between format and build and did NOT survive the conversion; the
# note at the end of this file says why, with the measurement.)

# every file committed or ignored; the .gitignore audit; and uncommitted edits to tracked files
# when CI_REQUIRE_CLEAN=1 (the old --require-clean).
[stage.tree]
cmd = "scripts/tree.sh"

# no document in CI_DOCS_FILES quotes a test count
[stage.docs]
cmd = "scripts/docs.sh"

# clang-format over the files this branch touches, and over their STAGED copy (what a commit
# would actually record). `when` is this stage's old CI_STRICT_TOOLS story: a machine without
# clang-format SKIPS the stage — kit-ci's own skip, which cannot be turned into a failure.
[stage.format]
cmd = "scripts/format.sh"
when = "tool:clang-format"

# configure + build, zero warnings
[stage.build]
cmd = "scripts/build.sh"
timeout = 0     # the old gate had no timeout; a cold build on a slow machine is not a failure

# the suite
[stage.tests]
cmd = "scripts/tests.sh"

# one version number: project(VERSION), the generated header, the CMake package-version file,
# and what the binaries print for --version
[stage.version]
cmd = "scripts/version.sh"

# ASan+UBSan in its own build dir
[stage.asan]
cmd = "scripts/asan.sh"
timeout = 0

# ThreadSanitizer in its own build dir
[stage.tsan]
cmd = "scripts/tsan.sh"
timeout = 0

# libFuzzer against the library's own round-trip oracle, CI_FUZZ_SECONDS (10 s by default:
# a REGRESSION budget for a push, not a campaign — long campaigns stay manual and out of band:
# CI_FUZZ_SECONDS=1800 scripts/fuzz.sh). timeout = 0 so that manual campaign is not cut off.
[stage.fuzz]
cmd = "scripts/fuzz.sh"
when = "tool:clang++"
timeout = 0

# clang-tidy with this repo's own .clang-tidy (the bug-finding subset), only findings new
# against CI_TIDY_BASELINE
[stage.tidy]
cmd = "scripts/tidy.sh"
when = "tool:clang-tidy"
timeout = 0

# git archive HEAD -> temp dir -> configure, build, test: proves the COMMITTED tree is complete
[stage.pristine]
cmd = "scripts/pristine.sh"
timeout = 0

# install tree + a two-file consumer built against it with find_package(Permuto)
[stage.package]
cmd = "scripts/package.sh"
timeout = 0

# ---------------------------------------------------------------- what did not survive
# `kitprobes` — the stage that ran tools/kit-probes/*.sh, holding this copy to the AI-DEV-STARTER
# fixes it claimed to carry (tidy-baseline, gate-stage-guards, git-index-file, hook-tiers-agree,
# format-checks-staged). It is gone, and so are the probes, because a probe is a check on a FILE
# THAT NO LONGER EXISTS: each one greps or sources the bash gate it was written for (its `$1` was
# tools/ci.sh) and asserts the fix is in that file. Measured 2026-10-06, against the new entry
# point scripts/gate.sh: format-checks-staged GREEN, git-index-file GREEN, gate-stage-guards RED,
# hook-tiers-agree RED, tidy-baseline RED — and both GREENs are accidents of how those two probes
# search, not measurements of the new gate. A stage whose verdict is accidental is the exact
# failure mode this whole gate exists to prevent, so the stage went rather than the evidence.
#
# The five guarantees themselves did NOT go; each one now lives in a file this policy names, and
# INCIDENTS.md records where, file by file. The one with no new home is gate-stage-guards, whose
# subject (a bash dispatch loop that can print GATE PASSED over stages that never ran) is now
# kit-ci's own job, and whose class kit-ci's runner tests already cover.
